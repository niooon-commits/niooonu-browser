name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Executable Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Release APK with Deterministic Key
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and Prepare APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found in android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" niooonu-browser-release.apk
          ls -lh niooonu-browser-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: niooonu-browser-release
          path: niooonu-browser-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Update Single GitHub Release (Overwrite Existing APK)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          RELEASE_TITLE="niooonu browser (v1.0.0)"
          APK_FILE="niooonu-browser-release.apk"

          echo "Checking if release '$TAG_NAME' already exists..."
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release '$TAG_NAME' exists. Overwriting/replacing APK asset..."
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes "### niooonu browser — Continuous Release
          - **File:** \`niooonu-browser-release.apk\`
          - **Signing Key:** Deterministic \`my-upload-key.jks\` (Permanent Signature)
          - **Commit:** \`${{ github.sha }}\`
          - **Last Updated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Successfully updated existing release asset!"
          else
            echo "Release '$TAG_NAME' does not exist yet. Creating initial release..."
            gh release create "$TAG_NAME" "$APK_FILE" \
              --title "$RELEASE_TITLE" \
              --notes "### niooonu browser — Initial Release
          - **File:** \`niooonu-browser-release.apk\`
          - **Signing Key:** Deterministic \`my-upload-key.jks\` (Permanent Signature)
          - **Commit:** \`${{ github.sha }}\`
          - **Created:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
              --latest
            echo "Successfully created initial release with APK!"
          fi
